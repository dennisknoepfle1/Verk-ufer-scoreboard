name: Web veröffentlichen

# Baut Admin-Bereich, Büro-Anzeige und Web-App und stellt sie auf EAS Hosting online.
# Benötigt im Repository das Secret EXPO_TOKEN. Die Supabase-Werte stehen in .env.production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mit Expo-Projekt verknüpfen
        run: npx --yes eas-cli@latest init --non-interactive --force
      - run: npm run build:web
      - name: Veröffentlichen
        run: npx --yes eas-cli@latest deploy --prod --non-interactive
