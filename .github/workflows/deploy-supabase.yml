name: Supabase einspielen

# Spielt neue Datenbank-Änderungen (supabase/migrations) und geänderte Edge Functions automatisch ein,
# sobald sie auf main landen. So muss niemand mehr Änderungen in Supabase von Hand bestätigen.
# Benötigt das Repository-Secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
#
# Migrationen: nur Dateien ab 20261121 (ältere wurden von Hand eingespielt). Jede Datei läuft genau einmal,
# in einer Transaktion, und wird in supabase_migrations.schema_migrations unter ihrem Dateinamen vermerkt.
# Edge Functions: nur die, deren Dateien sich im Push geändert haben (oder per Hand-Start gewählt), ohne JWT-Prüfung
# wie alle bisherigen Funktionen (sie prüfen selbst bzw. sind nur für den Zeitplan da).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Edge Functions, die neu bereitgestellt werden sollen (mit Leerzeichen getrennt)'
        required: false
        default: ''

concurrency: deploy-supabase

permissions:
  contents: read

env:
  PROJECT_REF: utivqklwuotsnhunassd
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  MIGRATIONS_FROM: '20261121000000'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schlüssel vorhanden?
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt"; exit 1; }
      - name: Neue Datenbank-Änderungen einspielen
        run: |
          set -euo pipefail
          q() { jq -n --arg q "$1" '{query: $q}' | curl -sS --fail-with-body -X POST \
                  "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-; }
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f" .sql); version=${base%%_*}; name=${base#*_}
            [[ "$version" < "$MIGRATIONS_FROM" ]] && continue
            done_before=$(q "select count(*) as n from supabase_migrations.schema_migrations where version = '$version'" | jq -r '.[0].n')
            if [ "$done_before" != "0" ]; then echo "schon eingespielt: $base"; continue; fi
            echo "spiele ein: $base"
            sql=$(cat "$f")
            q "begin;
          $sql
          ;
          insert into supabase_migrations.schema_migrations (version, name) values ('$version', '$name');
          commit;" > result.txt || { echo "::error::Einspielen von $base fehlgeschlagen: $(head -c 400 result.txt | tr '\n' ' ')"; exit 1; }
          done
      - name: Edge Functions bereitstellen (geänderte und noch fehlende)
        run: |
          set -uo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/functions"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          deployed=$(curl -sS "$api" -H "$auth" | jq -r '.[].slug' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            fns="${{ github.event.inputs.functions }}"
          else
            fns=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions 2>/dev/null | cut -d/ -f3 | sort -u | tr '\n' ' ' || true)
          fi
          # Noch nie bereitgestellte Funktionen dazunehmen (nur wenn die Liste sicher geladen wurde).
          if [ -n "$deployed" ]; then
            for dir in supabase/functions/*/; do
              fn=$(basename "$dir")
              grep -qx "$fn" <<< "$deployed" || fns="$fns $fn"
            done
          fi
          failed=0
          for fn in $(tr ' ' '\n' <<< "$fns" | sort -u); do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            echo "stelle bereit: $fn"
            args=(-F "metadata={\"name\":\"$fn\",\"entrypoint_path\":\"index.ts\",\"verify_jwt\":false}")
            for f in supabase/functions/$fn/*.ts; do args+=(-F "file=@$f;filename=$(basename "$f")"); done
            out=$(curl -sS -w '\n%{http_code}' -X POST "$api/deploy?slug=$fn" -H "$auth" "${args[@]}")
            code=$(tail -1 <<< "$out")
            if [ "${code:0:1}" != "2" ]; then
              echo "::error::Bereitstellen von $fn fehlgeschlagen ($code): $(head -c 400 <<< "$out" | tr '\n' ' ')"
              failed=1
            fi
          done
          exit $failed
      - name: mobile.de-Abruf einmal anstoßen
        run: |
          curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/mobile-sync" -H 'Content-Type: application/json' -d '{}' || true
